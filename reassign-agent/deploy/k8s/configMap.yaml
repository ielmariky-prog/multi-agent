apiVersion: v1
kind: ConfigMap
metadata:
  name: reassign-agent-config
  namespace: multi-agent
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka.multi-agent.svc.cluster.local:9092"
  KAFKA_REASSIGN_INPUT_TOPIC: "reassign-input-topic"
  KAFKA_REASSIGN_OUTPUT_TOPIC: "audit.events.in"
  KAFKA_REASSIGN_GROUP_ID: "reassign-agent-group"
  AI_CORE_URL: "http://ai-core.multi-agent.svc.cluster.local:8081"
  AI_CORE_TIMEOUT_MS: "60000"
