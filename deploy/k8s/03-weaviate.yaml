apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  namespace: multi-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          image: semitechnologies/weaviate:1.25.3
          ports:
            - containerPort: 8080
          env:
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "true"
            - name: PERSISTENCE_DATA_PATH
              value: "/var/lib/weaviate"
            - name: QUERY_DEFAULTS_LIMIT
              value: "20"
            - name: DEFAULT_VECTORIZER_MODULE
              value: "none"
          volumeMounts:
            - name: weaviate-data
              mountPath: /var/lib/weaviate
          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /v1/.well-known/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: weaviate-data
          emptyDir: {}   # données perdues au redémarrage du pod — acceptable en dev local
                         # en production : remplacer par un PersistentVolumeClaim
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: multi-agent
spec:
  selector:
    app: weaviate
  ports:
    - port: 8080
      targetPort: 8080
