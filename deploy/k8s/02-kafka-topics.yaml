apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: multi-agent
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka.multi-agent.svc.cluster.local 9092; do echo 'Kafka pas encore prêt...'; sleep 5; done; echo 'Kafka prêt !'"]
      containers:
        - name: create-topics
          image: confluentinc/cp-kafka:7.6.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              BOOTSTRAP=kafka.multi-agent.svc.cluster.local:9092

              create_topic() {
                kafka-topics --bootstrap-server $BOOTSTRAP --create --if-not-exists --topic $1 --partitions 3 --replication-factor 1
              }

              create_topic intent-input-topic
              create_topic reasoning-input-topic
              create_topic reassign-input-topic
              create_topic audit.events.in
              create_topic audit.events.out
              create_topic documents.raw
              create_topic workflow-output-topic

              echo "✅ Tous les topics Kafka créés."

              kafka-topics --bootstrap-server $BOOTSTRAP --list
